<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OLLDAY 콘텐츠 관리</title><link rel="stylesheet" href="/assets/fonts/fonts.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/cms.css"><script src="/admin.js" defer></script></head><body><header><a href="/" aria-label="홈"><img class="logo" src="/assets/ollday-logo.png" alt="OLLDAY"></a><span>콘텐츠 관리</span><button id="logout" hidden>로그아웃</button></header><main class="cms"><h1>Content studio</h1><p id="admin-status" role="status" aria-live="polite"></p><form id="login-form" class="cms-panel"><h2>관리자 로그인</h2><label>관리자 비밀번호<input type="password" name="password" required minlength="12" maxlength="200" autocomplete="current-password"></label><button class="button dark" type="submit">로그인</button><p>일반 방문자는 로그인 없이 사이트를 이용합니다.</p></form><div id="studio" hidden><div class="cms-toolbar"><button class="button dark" id="new-content">새 콘텐츠 작성 ＋</button><input id="search-content" aria-label="제목 검색" placeholder="제목 검색"><select id="kind-filter" aria-label="게시판 필터"><option value="">모든 게시판</option><option value="collection">Collection</option><option value="magazine">Magazine</option><option value="news">소식</option></select><button id="reload">목록 새로고침</button></div><div id="editor" hidden></div><div id="post-list"></div></div></main></body></html>
